<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<title>ONLINE E-QSL</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

body{
background:#111;
color:#00ff66;
font-family:Consolas;
padding:20px;
text-align:center;
}

h1{
color:#ffd700;
}

input{
padding:12px;
font-size:20px;
width:300px;
text-align:center;
background:#000;
color:#00ff66;
border:2px solid #00ff66;
}

button{
padding:12px;
font-size:18px;
margin-top:10px;
margin-left:5px;
background:#222;
color:#ffd700;
border:2px solid #ffd700;
cursor:pointer;
}

#qsl{
width:900px;
height:500px;
margin:30px auto;
background:#222;
border:5px solid #ffd700;
display:none;
position:relative;
color:white;
}

.content{
padding-top:80px;
font-size:28px;
line-height:1.8;
}

.title{
font-size:40px;
color:#ffd700;
font-weight:bold;
}

.notfound{
margin-top:20px;
color:red;
font-size:20px;
}

</style>

</head>

<body>

<h1>ONLINE DOWNLOAD E-QSL</h1>

<input id="searchCall" placeholder="INPUT CALLSIGN">

<br>

<button onclick="searchQSL()">
TAMPILKAN QSL
</button>

<button onclick="downloadJPG()">
DOWNLOAD JPG
</button>

<button onclick="printQSL()">
PRINT QSL
</button>

<div id="message"></div>

<div id="qsl">

<div class="content">

<div class="title">
ORARI NET MALAM
</div>

TO : <span id="call"></span><br>

DATE : <span id="date"></span><br>

TIME : <span id="time"></span><br>

BAND : <span id="band"></span><br>

FREQ : <span id="freq"></span><br>

MODE : <span id="mode"></span><br>

OPERATOR : <span id="operator"></span>

</div>

</div>

<script>

function searchQSL(){

let input=document.getElementById("searchCall")
.value.toUpperCase().trim();

fetch("qso.json")

.then(response => response.json())

.then(data => {

let found=data.find(
q => q.call === input
);

if(found){

document.getElementById("message")
.innerHTML="";

document.getElementById("qsl")
.style.display="block";

document.getElementById("call")
.innerText=found.call;

document.getElementById("date")
.innerText=found.date;

document.getElementById("time")
.innerText=found.time;

document.getElementById("band")
.innerText=found.band;

document.getElementById("freq")
.innerText=found.freq;

document.getElementById("mode")
.innerText=found.mode;

document.getElementById("operator")
.innerText=found.operator;

}else{

document.getElementById("qsl")
.style.display="none";

document.getElementById("message")
.innerHTML=
"<div class='notfound'>CALLSIGN TIDAK DITEMUKAN</div>";

}

})

.catch(error => {

console.log(error);

document.getElementById("message")
.innerHTML=
"<div class='notfound'>GAGAL MEMBACA QSO.JSON</div>";

});

}

function downloadJPG(){

let qsl=document.getElementById("qsl");

html2canvas(qsl).then(canvas=>{

let link=document.createElement("a");

link.download="E-QSL.jpg";

link.href=canvas.toDataURL("image/jpeg");

link.click();

});

}

function printQSL(){

window.print();

}

document.addEventListener("keydown",function(e){

if(e.key==="Enter"){

searchQSL();

}

});

</script>

</body>
</html>
